server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Telegram WebApp embeds this page in an iframe-like webview.
    add_header X-Frame-Options "" always;
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ /index.html;
    }
}
